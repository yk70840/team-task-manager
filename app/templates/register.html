{% extends "base.html" %}
{% block title %}Create Account | Team Task Manager{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card" style="max-width:480px;">
    <div class="auth-logo">
      <span class="auth-logo-dot"></span>
      <span class="auth-logo-text">Team Task Manager</span>
    </div>

    <p class="auth-eyebrow">Get started</p>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Join your workspace and start collaborating.</p>

    {% if error %}
    <div class="auth-error" style="margin-top:1.25rem;">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register" style="margin-top:1.75rem; display:flex; flex-direction:column; gap:1rem;">
      <div style="display:grid; gap:1rem; grid-template-columns:1fr 1fr;">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" name="username" required minlength="3" autocomplete="username"
            class="form-control" placeholder="yourname">
        </div>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email"
            class="form-control" placeholder="you@example.com">
        </div>
      </div>
      <div style="display:grid; gap:1rem; grid-template-columns:1fr 1fr;">
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password"
            class="form-control" placeholder="Min. 6 chars">
        </div>
        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password"
            class="form-control" placeholder="Repeat password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top:0.5rem;">
        Create Account
      </button>
    </form>

    <p class="auth-footer">Already have an account?
      <a href="/login">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
