{% extends "base.html" %}
{% block title %}Create Project | Team Task Manager{% endblock %}

{% block content %}
<div style="max-width:600px; margin:0 auto;">
  <div class="page-header" style="margin-bottom:1.5rem;">
    <div>
      <p class="page-eyebrow">New Project</p>
      <h1 class="page-title">Create a project</h1>
      <p class="page-sub">Start a new project and invite the team to collaborate.</p>
    </div>
    <a href="/projects" class="btn btn-ghost">← Back</a>
  </div>

  <div class="card" style="padding:2rem;">
    <form method="POST" action="/projects/create"
          onsubmit="return confirmAction('Create this project?', this, 'info');"
          style="display:flex; flex-direction:column; gap:1.25rem;">
      <div class="form-group">
        <label for="name" class="form-label">Project name</label>
        <input type="text" id="name" name="name" required minlength="3"
          class="form-control" placeholder="e.g. Marketing website">
      </div>
      <div class="form-group">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" name="description" rows="5"
          class="form-control" placeholder="Describe the project goals and scope."></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:0.6rem; padding-top:0.25rem;">
        <a href="/projects" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Create Project</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
